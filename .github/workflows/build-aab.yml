name: Build Release AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Generate Keystore
        run: keytool -genkey -v -keystore app/edithub.jks -alias edithub -keyalg RSA -keysize 2048 -validity 10000 -storepass Edithub@123 -keypass Edithub@123 -dname "CN=EditHub AI, OU=EditHub, O=EditHub, L=Karjat, ST=Maharashtra, C=IN"
      - name: Build Release
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/edithub.jks -Pandroid.injected.signing.store.password=Edithub@123 -Pandroid.injected.signing.key.alias=edithub -Pandroid.injected.signing.key.password=Edithub@123
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/edithub.jks -Pandroid.injected.signing.store.password=Edithub@123 -Pandroid.injected.signing.key.alias=edithub -Pandroid.injected.signing.key.password=Edithub@123
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EditHub-Release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
