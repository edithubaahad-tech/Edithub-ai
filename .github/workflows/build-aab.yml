name: Build Release AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      
      - name: Generate Keystore
        run: keytool -genkey -v -keystore app/edithub.jks -alias edithub -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Edith, OU=App, O=Edith, L=Pune, S=MH, C=IN"

      - name: Build Release
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/edithub.jks -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=edithub -Pandroid.injected.signing.key.password=android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/edithub.jks -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=edithub -Pandroid.injected.signing.key.password=android

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EdithHub-Release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
