name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload artifact app-debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/${REPO}-debug-build-${{ github.run_number }}.apk
          ls -lh /tmp/out/

      - name: Create Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          files: /tmp/out/*.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}